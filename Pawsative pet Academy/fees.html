<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Fees - Pawsative Pet Academy</title>
    <link rel="stylesheet" href="web-master.css">
    <style>
        /* Specific layout rules matching wireframe properties */
        .cart-wrapper-row { margin-bottom: 15px; }
        .cart-empty-notice { text-align: center; padding: 35px; background: #fff; border: 1px dashed #bbb; font-weight: bold; color: #666; font-size: 14px; }
        .checkout-actions-row { display: flex; justify-content: flex-end; gap: 20px; margin-top: 25px; }
        .btn-link-cancel { background: #e0e0e0; color: #333; font-weight: bold; text-decoration: none; padding: 12px 40px; border-radius: 25px; border: 1px solid #ccc; font-size: 14px; display: inline-block; text-align: center; text-transform: uppercase; cursor: pointer; }
        .block-btn-override { margin: 0; min-width: 240px; text-transform: uppercase; display: inline-block; line-height: normal; }
    </style>
</head>
<body>
    <header class="site-header">
        
            <div class="logo-ph"><img src="logo.jpeg"width="50"></img></div>
            <h1>Pawsative pet academy</h1>
        </div>
        <nav class="nav-links">
            <a href="Homepage.html">HOME</a>
            <a href="about.html">ABOUT US</a>
            <a href="courses.html">COURSES</a>
            <a href="fees.html" class="active">ACCOUNT</a>
        </nav>
    </header>

    <main class="page-container">
        <div class="green-category-tag">MY COURSE</div>
        <h2 class="title-heading">COURSE</h2>

        <!-- Reactive Item List Table Area -->
        <div id="cart-list-table" class="cart-wrapper-table">
            <!-- Selected high-fidelity items load inside this container -->
        </div>

        <!-- Tiered Cost Tracking Breakdown Summary Box -->
        <div class="checkout-breakdown">
            <div class="calc-row-web">
                <span>PRICE BEFORE DISCOUNT</span>
                <span id="price-before-field">R0</span>
            </div>
            <div class="calc-row-web">
                <span>DISCOUNT TIER APPLIED</span>
                <span id="discount-tier-field">0%</span>
            </div>
            <div class="calc-row-web">
                <span>TOTAL SAVINGS VALUE</span>
                <span id="discount-amount-field">-R0</span>
            </div>
            <div class="calc-row-web final-row">
                <span>TOTAL PRICE</span>
                <span id="total-price-field">R0</span>
            </div>
        </div>

        <!-- Control Navigation Action Container Row (Using standard <a> elements matching your requested construction style) -->
        <div class="checkout-actions-row">
            <a class="btn-link-cancel" onclick="cancelCartRegistration()">CANCEL</a>
            <a href="contact.html" class="gold-link-btn block-btn-web block-btn-override" onclick="confirmPaymentCheckout(event)">CONFIRM PAYMENT</a>
        </div>
    </main>
      <script>
        // Load target items safely out of browser database
        function loadCurrentCartData() {
            return JSON.parse(localStorage.getItem('pawsative_cart')) || [];
        }

        // Render calculations dynamically on display labels
        function updateFeesScreenView() {
            const currentItems = loadCurrentCartData();
            const containerElement = document.getElementById('cart-list-table');
            containerElement.innerHTML = '';

            // Check if cart is empty
            if (currentItems.length === 0) {
                containerElement.innerHTML = `<div class="cart-empty-notice">Your profile doesn't have any selected items. Click "APPLY NOW" on a course details layout screen.</div>`;
                document.getElementById('price-before-field').innerText = 'R0';
                document.getElementById('discount-tier-field').innerText = '0%';
                document.getElementById('discount-amount-field').innerText = '-R0';
                document.getElementById('total-price-field').innerText = 'R0';
                return;
            }

            let initialSubtotal = 0;

            // Generate row entries for each saved course selection using link styles for triggers
            currentItems.forEach((courseItem, itemIndex) => {
                initialSubtotal += courseItem.price;
                containerElement.innerHTML += `
                    <div class="cart-wrapper-row">
                        <div class="cart-item-placeholder">[add pic here: ${courseItem.name}]</div>
                        <div class="cart-item-controls">
                            <span class="lbl-status-green">COURSE: ${courseItem.name} (R${courseItem.price})</span>
                            <button class="lbl-action-gold" style="width: 100%; text-align: center;" onclick="removeSingleCourse(${itemIndex})">UNSELECT</button>
                        </div>
                    </div>
                `;
            });

            // Tiered Discount calculations matching core business logic specifications
            let discountRate = 0;
            const chosenQuantity = currentItems.length;

            if (chosenQuantity === 1) {
                discountRate = 0;
            } else if (chosenQuantity === 2) {
                discountRate = 5;
            } else if (chosenQuantity === 3) {
                discountRate = 10;
            } else if (chosenQuantity > 3) {
                discountRate = 15;
            }

            let savedValueSum = (initialSubtotal * discountRate) / 100;
            let definitiveTotal = initialSubtotal - savedValueSum;

            // Update UI elements with exact current values
            document.getElementById('price-before-field').innerText = 'R' + initialSubtotal;
            document.getElementById('discount-tier-field').innerText = discountRate + '%';
            document.getElementById('discount-amount-field').innerText = '-R' + savedValueSum;
            document.getElementById('total-price-field').innerText = 'R' + definitiveTotal;
        }

        // Drop specific unique target selections
        function removeSingleCourse(itemIndex) {
            let activeItems = loadCurrentCartData();
            activeItems.splice(itemIndex, 1);
            localStorage.setItem('pawsative_cart', JSON.stringify(activeItems));
            updateFeesScreenView();
        }

        // Handle the clear / "CANCEL" routine properly
        function cancelCartRegistration() {
            if (confirm("Are you sure you want to cancel and clear all chosen courses from your summary sheet?")) {
                localStorage.removeItem('pawsative_cart');
                updateFeesScreenView();
            }
        }

        // Proceed forward on "CONFIRM PAYMENT" link execution
        function confirmPaymentCheckout(event) {
            const activeItems = loadCurrentCartData();
            if (activeItems.length === 0) {
                event.preventDefault(); // Stop navigation to contact page
                alert("Your workspace profile contains 0 registered selections. Please choose a training layout track first.");
                return;
            }
            alert("Payment successfully processed! Redirecting to contact desk layout channels.");
        }

        // Initial launch screen tracking
        window.onload = updateFeesScreenView;
    </script>
</body>
</html>
